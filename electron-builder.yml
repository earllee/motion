appId: com.earlleeventures.motion
productName: Motion
copyright: Earl Lee
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
mac:
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dir
      arch: [arm64]
  # unsigned for `npm run package`; scripts/release.sh signs with a Developer ID and notarizes
  identity: null
  hardenedRuntime: true
  extendInfo:
    NSHighResolutionCapable: true
    # the documents Motion opens; .sql has no system type, so Motion declares one
    CFBundleDocumentTypes:
      - CFBundleTypeName: Markdown Document
        CFBundleTypeRole: Editor
        LSHandlerRank: Owner
        CFBundleTypeIconFile: icon.icns
        LSItemContentTypes: [net.daringfireball.markdown, io.typora.markdown, com.earlleeventures.motion.mdx]
        CFBundleTypeExtensions: [md, markdown, mdx]
      - CFBundleTypeName: SQL Query
        CFBundleTypeRole: Editor
        LSHandlerRank: Owner
        CFBundleTypeIconFile: icon.icns
        LSItemContentTypes: [com.earlleeventures.motion.sql]
        CFBundleTypeExtensions: [sql]
    UTImportedTypeDeclarations:
      - UTTypeIdentifier: com.earlleeventures.motion.sql
        UTTypeDescription: SQL Query
        UTTypeConformsTo: [public.plain-text, public.source-code]
        UTTypeTagSpecification:
          public.filename-extension: [sql]
      - UTTypeIdentifier: com.earlleeventures.motion.mdx
        UTTypeDescription: MDX Document
        UTTypeConformsTo: [public.plain-text]
        UTTypeTagSpecification:
          public.filename-extension: [mdx]
